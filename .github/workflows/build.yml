name: Test, Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: Read version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a valid release version: $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME must match VERSION file v$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WANIPv4-Watcher v$VERSION"

      - name: Check Chinese release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES_FILE="docs/releases/v${VERSION}-CN.md"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "::error::缺少中文发布说明文件：$NOTES_FILE。请先补全该版本的中文变更、测试结果和已知限制，再发布。"
            exit 1
          fi
          echo "Chinese release notes verified: $NOTES_FILE"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/bootstrap.sh
          sh -n scripts/install-padavan.sh
          sh -n scripts/uninstall-padavan.sh

      - name: Build Linux MIPSLE soft-float for Padavan
        env:
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}" \
            -o dist/wanipv4-watcher-linux-mipsle-softfloat ./cmd/wanipv4-watcher
          cp dist/wanipv4-watcher-linux-mipsle-softfloat \
            "dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-mipsle-softfloat"
          file dist/wanipv4-watcher-linux-mipsle-softfloat

      - name: Build Linux AMD64 diagnostic binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}" \
            -o dist/wanipv4-watcher-linux-amd64 ./cmd/wanipv4-watcher
          cp dist/wanipv4-watcher-linux-amd64 \
            "dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-amd64"

      - name: Package source and checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --prefix="WANIPv4-Watcher-v${VERSION}/" HEAD \
            -o "dist/WANIPv4-Watcher-v${VERSION}-source.tar.gz"
          cat > "dist/WANIPv4-Watcher-BUILD-REPORT-CN-v${VERSION}.md" <<REPORT
          # WANIPv4-Watcher v${VERSION} 构建报告

          - 构建提交：`${GITHUB_SHA}`
          - 工作流触发：`${GITHUB_EVENT_NAME}` / `${GITHUB_REF}`
          - Go 版本：`$(go version)`
          - 单元测试：通过（`go test ./...`）
          - 静态检查：通过（`go vet ./...`）
          - Padavan 主目标：`linux/mipsle`，`GOMIPS=softfloat`，`CGO_ENABLED=0`
          - 诊断目标：`linux/amd64`，`CGO_ENABLED=0`
          - 链接方式：纯 Go 静态链接，不依赖路由器上的 libc/OpenSSL 动态库
          - SHA-256 清单：`checksums.txt`

          说明：此报告来自 GitHub Actions 构建流程。MIPSLE 交叉编译成功不等于已经在真实 K2P Padavan 路由器上完成运行测试；实际 WAN 接口和 QQ SMTP 仍需设备侧验证。
          REPORT
          cd dist
          sha256sum \
            wanipv4-watcher-linux-mipsle-softfloat \
            "WANIPv4-Watcher-v${VERSION}-linux-mipsle-softfloat" \
            wanipv4-watcher-linux-amd64 \
            "WANIPv4-Watcher-v${VERSION}-linux-amd64" \
            "WANIPv4-Watcher-v${VERSION}-source.tar.gz" \
            "WANIPv4-Watcher-BUILD-REPORT-CN-v${VERSION}.md" \
            > checksums.txt
          cp checksums.txt "WANIPv4-Watcher-v${VERSION}-checksums.txt"
          cat checksums.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WANIPv4-Watcher-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          name: WANIPv4-Watcher-${{ steps.meta.outputs.version }}
          path: dist

      - name: Decide whether this version should be published
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "Tag and VERSION mismatch" >&2
              exit 1
            fi
            echo "do_publish=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --refs origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            NOTES_FILE="docs/releases/v${VERSION}-CN.md"
            if [[ -f "$NOTES_FILE" ]] && git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA" | grep -Fxq "$NOTES_FILE"; then
              echo "Chinese release notes changed; updating the existing Release v$VERSION."
              echo "do_publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release v$VERSION already exists; this commit does not update its Chinese release notes."
              echo "do_publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No v$VERSION tag exists yet; publishing the initial version from this commit."
            echo "do_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release assets
        if: steps.publish.outputs.do_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WANIPv4-Watcher v${{ steps.meta.outputs.version }}
          generate_release_notes: false
          body_path: docs/releases/v${{ steps.meta.outputs.version }}-CN.md
          make_latest: true
          overwrite_files: true
          files: |
            dist/wanipv4-watcher-linux-mipsle-softfloat
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-mipsle-softfloat
            dist/wanipv4-watcher-linux-amd64
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-amd64
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-source.tar.gz
            dist/WANIPv4-Watcher-BUILD-REPORT-CN-v${{ steps.meta.outputs.version }}.md
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-checksums.txt
            dist/checksums.txt
