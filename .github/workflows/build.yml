name: Test, Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: Read version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a valid release version: $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME must match VERSION file v$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WANIPv4-Watcher v$VERSION"

      - name: Check Chinese release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          NOTES_FILE="docs/releases/v${VERSION}-CN.md"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "::error::缺少中文发布说明：$NOTES_FILE"
            exit 1
          fi
          while IFS= read -r TAG; do
            [[ -n "$TAG" ]] || continue
            TAG_VERSION="$(printf '%s' "$TAG" | sed 's/^v//')"
            TAG_NOTES="docs/releases/v${TAG_VERSION}-CN.md"
            if [[ ! -s "$TAG_NOTES" ]]; then
              echo "::error::已存在版本标签 $TAG，但缺少中文发布说明 $TAG_NOTES"
              exit 1
            fi
          done < <(git tag -l 'v*' | sort -V)

      - name: Unit tests
        run: go test ./...

      - name: Static analysis
        run: go vet ./...

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            echo "Checking $script"
            sh -n "$script"
          done

      - name: Prepare output directory
        run: mkdir -p dist

      - name: Build Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}" -o dist/wanipv4-watcher-linux-arm64 ./cmd/wanipv4-watcher

      - name: Build Linux ARMv7 hard-float
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}" -o dist/wanipv4-watcher-linux-armv7 ./cmd/wanipv4-watcher

      - name: Build Linux AMD64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}" -o dist/wanipv4-watcher-linux-amd64 ./cmd/wanipv4-watcher

      - name: Build Linux MIPS little-endian soft-float
        env:
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}" -o dist/wanipv4-watcher-linux-mipsle-softfloat ./cmd/wanipv4-watcher

      - name: Build Linux MIPS little-endian hard-float
        env:
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: hardfloat
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}" -o dist/wanipv4-watcher-linux-mipsle-hardfloat ./cmd/wanipv4-watcher

      - name: Build Linux MIPS big-endian soft-float
        env:
          GOOS: linux
          GOARCH: mips
          GOMIPS: softfloat
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}" -o dist/wanipv4-watcher-linux-mips-softfloat ./cmd/wanipv4-watcher

      - name: Build Linux MIPS big-endian hard-float
        env:
          GOOS: linux
          GOARCH: mips
          GOMIPS: hardfloat
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}" -o dist/wanipv4-watcher-linux-mips-hardfloat ./cmd/wanipv4-watcher

      - name: Build Linux RISC-V 64-bit
        env:
          GOOS: linux
          GOARCH: riscv64
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}" -o dist/wanipv4-watcher-linux-riscv64 ./cmd/wanipv4-watcher

      - name: Verify binary formats
        run: |
          set -euo pipefail
          file dist/wanipv4-watcher-linux-*

      - name: Package source, build report and checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --prefix="WANIPv4-Watcher-v$VERSION/" HEAD \
            -o "dist/WANIPv4-Watcher-v$VERSION-source.tar.gz"
          cat > "dist/WANIPv4-Watcher-BUILD-REPORT-CN-v$VERSION.md" <<REPORT
          # WANIPv4-Watcher v$VERSION 构建报告

          - 构建提交：$GITHUB_SHA
          - 触发方式：$GITHUB_EVENT_NAME / $GITHUB_REF
          - Go 版本：$(go version)
          - 单元测试：通过（go test ./...）
          - 静态检查：通过（go vet ./...）
          - Shell 脚本语法检查：通过（scripts/*.sh）
          - linux/arm64：ARM64 / AArch64
          - linux/arm（GOARM=7）：32 位 ARMv7
          - linux/amd64：x86-64
          - linux/mipsle：soft-float 与 hard-float
          - linux/mips：soft-float 与 hard-float
          - linux/riscv64：64 位 RISC-V
          - 所有目标均设置 CGO_ENABLED=0，不依赖路由器上的 libc/OpenSSL 动态链接。

          构建与自动测试成功不等于所有设备均已实机验证。选择 MIPS 浮点 ABI 时必须与固件用户态匹配；梅林安装器针对 ARM64/AArch64 目标。具体型号支持情况请查看 Release 资产说明和中文文档。
          REPORT
          # Versioned filenames are for people; unversioned names remain stable for installer URLs.
          for asset in \
            wanipv4-watcher-linux-arm64 \
            wanipv4-watcher-linux-armv7 \
            wanipv4-watcher-linux-amd64 \
            wanipv4-watcher-linux-mipsle-softfloat \
            wanipv4-watcher-linux-mipsle-hardfloat \
            wanipv4-watcher-linux-mips-softfloat \
            wanipv4-watcher-linux-mips-hardfloat \
            wanipv4-watcher-linux-riscv64; do
            versioned="WANIPv4-Watcher-v$VERSION-${asset#wanipv4-watcher-}"
            cp "dist/$asset" "dist/$versioned"
          done
          cd dist
          sha256sum \
            wanipv4-watcher-linux-arm64 \
            wanipv4-watcher-linux-armv7 \
            wanipv4-watcher-linux-amd64 \
            wanipv4-watcher-linux-mipsle-softfloat \
            wanipv4-watcher-linux-mipsle-hardfloat \
            wanipv4-watcher-linux-mips-softfloat \
            wanipv4-watcher-linux-mips-hardfloat \
            wanipv4-watcher-linux-riscv64 \
            "WANIPv4-Watcher-v$VERSION-linux-arm64" \
            "WANIPv4-Watcher-v$VERSION-linux-armv7" \
            "WANIPv4-Watcher-v$VERSION-linux-amd64" \
            "WANIPv4-Watcher-v$VERSION-linux-mipsle-softfloat" \
            "WANIPv4-Watcher-v$VERSION-linux-mipsle-hardfloat" \
            "WANIPv4-Watcher-v$VERSION-linux-mips-softfloat" \
            "WANIPv4-Watcher-v$VERSION-linux-mips-hardfloat" \
            "WANIPv4-Watcher-v$VERSION-linux-riscv64" \
            "WANIPv4-Watcher-v$VERSION-source.tar.gz" \
            "WANIPv4-Watcher-BUILD-REPORT-CN-v$VERSION.md" \
            > checksums.txt
          cat checksums.txt
          cp checksums.txt "WANIPv4-Watcher-v$VERSION-checksums.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WANIPv4-Watcher-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: WANIPv4-Watcher-${{ steps.meta.outputs.version }}
          path: dist

      - name: Decide whether this version should be published
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "Tag and VERSION mismatch" >&2
              exit 1
            fi
            echo "do_publish=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --refs origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            NOTES_FILE="docs/releases/v${VERSION}-CN.md"
            if [[ -s "$NOTES_FILE" ]] && git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA" | grep -Fxq "$NOTES_FILE"; then
              echo "Chinese notes changed; updating Release v$VERSION and its assets."
              echo "do_publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release v$VERSION already exists; this commit does not change its version notes."
              echo "do_publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No v$VERSION tag exists yet; publishing this tested commit."
            echo "do_publish=true" >> "$GITHUB_OUTPUT"
          fi


      - name: Update historical release-note bodies
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CHANGED_NOTES="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- 'docs/releases/v*-CN.md')"
          if [[ -z "$CHANGED_NOTES" ]]; then
            echo "No release-note files changed."
            exit 0
          fi
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          while IFS= read -r NOTES_FILE; do
            [[ -n "$NOTES_FILE" ]] || continue
            FILE_NAME="$(basename "$NOTES_FILE")"
            RELEASE_TAG="$(printf '%s' "$FILE_NAME" | sed 's/-CN\.md$//')"
            if [[ "$RELEASE_TAG" == "v$CURRENT_VERSION" ]]; then
              continue
            fi
            if [[ ! -s "$NOTES_FILE" ]]; then
              echo "::error::Missing or empty notes file: $NOTES_FILE"
              exit 1
            fi
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Updating historical release body: $RELEASE_TAG"
              gh release edit "$RELEASE_TAG" --title "WANIPv4-Watcher $RELEASE_TAG" --notes-file "$NOTES_FILE"
            else
              echo "::warning::No existing GitHub Release found for $RELEASE_TAG; skipping historical body update."
            fi
          done <<< "$CHANGED_NOTES"
      - name: Create release with architecture assets
        id: publish-release
        if: steps.publish.outputs.do_publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WANIPv4-Watcher v${{ steps.meta.outputs.version }}
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          preserve_order: true
          body_path: docs/releases/v${{ steps.meta.outputs.version }}-CN.md
          files: |
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-arm64
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-armv7
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-amd64
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-mipsle-softfloat
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-mipsle-hardfloat
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-mips-softfloat
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-mips-hardfloat
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-linux-riscv64
            dist/wanipv4-watcher-linux-arm64
            dist/wanipv4-watcher-linux-armv7
            dist/wanipv4-watcher-linux-amd64
            dist/wanipv4-watcher-linux-mipsle-softfloat
            dist/wanipv4-watcher-linux-mipsle-hardfloat
            dist/wanipv4-watcher-linux-mips-softfloat
            dist/wanipv4-watcher-linux-mips-hardfloat
            dist/wanipv4-watcher-linux-riscv64
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-source.tar.gz
            dist/WANIPv4-Watcher-BUILD-REPORT-CN-v${{ steps.meta.outputs.version }}.md
            dist/WANIPv4-Watcher-v${{ steps.meta.outputs.version }}-checksums.txt
            dist/checksums.txt
